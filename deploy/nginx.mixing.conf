# 调一杯 · 生产 Nginx 站点配置
# 部署：sudo cp deploy/nginx.mixing.conf /etc/nginx/sites-available/mixing
#       sudo ln -s /etc/nginx/sites-available/mixing /etc/nginx/sites-enabled/mixing
#       sudo rm -f /etc/nginx/sites-enabled/default
#       sudo nginx -t && sudo systemctl reload nginx
#
# 域名 myty11.com 已解析到 8.134.248.177；备案期间用 http://8.134.248.177 访问。
# 备案通过后执行 sudo certbot --nginx -d myty11.com，
# certbot 会自动为本文件追加 443 与证书配置。
#
# 安全说明见指南「上线后的安全加固」：根路径不再暴露后台、登录接口限流、
# 可选 HTTP Basic Auth 与后台独立子域名。

# 登录接口限流：同一 IP 每分钟 5 次请求
# limit_req_zone 必须位于 http 上下文；本文件由 sites-enabled include 进 http {}，故放在 server 块外
limit_req_zone $binary_remote_addr zone=adminlogin:10m rate=5r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name myty11.com www.myty11.com 8.134.248.177;

    root /var/www/mixing-drinks/manage/dist;
    index index.html;
    client_max_body_size 6m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/mixing.access.log;
    error_log  /var/log/nginx/mixing.error.log;

    # 根路径不再返回管理后台：只回一行文本，后台请从 /login 进入
    # 想更隐蔽可改成 return 404; 想放官网首页可换成静态站点
    location = / {
        default_type text/plain;
        return 200 'Mixing Drinks API service';
    }

    # 管理员登录限流：覆盖 /admin/login 与 /auth/admin/login 两个入口
    location ~ ^/api/v1/(admin|auth/admin)/login$ {
        limit_req zone=adminlogin burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端 API：Express 监听 127.0.0.1:3000
    location /api/v1/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 封面上传：后端 express.static(server/public/uploads)
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
    }

    # 图标上传：实际写入 manage/public/images/upload
    location /images/ {
        alias /var/www/mixing-drinks/manage/public/images/;
        expires 7d;
    }

    # React Router SPA（/login、/dashboard 等后台页面）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 可选：给后台页面再加一道 HTTP Basic Auth
    # 必须先在服务器生成 /etc/nginx/.htpasswd 再取消注释，否则后台页面会 500；
    # /api/v1 不受影响，小程序仍可正常请求。
    # location ~ ^/(login|dashboard|cocktails|ingredients|categories|users) {
    #     auth_basic "Admin";
    #     auth_basic_user_file /etc/nginx/.htpasswd;
    #     try_files $uri $uri/ /index.html;
    # }
}
