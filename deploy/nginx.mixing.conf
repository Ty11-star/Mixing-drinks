# 调一杯 · 生产 Nginx 站点配置
# 部署：sudo cp deploy/nginx.mixing.conf /etc/nginx/sites-available/mixing
#       sudo ln -sf /etc/nginx/sites-available/mixing /etc/nginx/sites-enabled/mixing
#       sudo rm -f /etc/nginx/sites-enabled/default
#       sudo nginx -t && sudo systemctl reload nginx
#
# 三个 server 块（详见指南「5.1 上线后的安全加固」）：
#   A 主域 myty11.com           → 纯展示欢迎页 + /api/v1 + /uploads + /images，不含后台
#   B 管理子域 manage.myty11.com  → manage/dist 后台 + 同源 API 反代 + 可选 Basic Auth
#   C 备案期入口 8.134.248.177   → 根路径=欢迎页，/login 等=后台；备案通过后把 IP 从 server_name 移除
#
# 备案通过后：sudo certbot --nginx -d myty11.com -d manage.myty11.com
# certbot 会自动给 A、B 两个 server 块追加 443 与证书配置；C 块（纯 IP）不参与。

# 登录接口限流：同一 IP 每分钟 5 次请求
# limit_req_zone 必须位于 http 上下文；本文件由 sites-enabled include 进 http {}，故放在 server 块外
limit_req_zone $binary_remote_addr zone=adminlogin:10m rate=5r/m;

# ============================================================
# A. 主域：欢迎页 + 小程序/后台共用的 API，不提供任何后台页面
# ============================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name myty11.com www.myty11.com;

    root /var/www/mixing-drinks/deploy/welcome;
    index index.html;
    client_max_body_size 6m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/mixing.access.log;
    error_log  /var/log/nginx/mixing.error.log;

    # 根路径：纯展示欢迎页
    location = / {
        try_files /index.html =404;
    }

    # 管理员登录限流：覆盖 /admin/login 与 /auth/admin/login 两个入口
    location ~ ^/api/v1/(admin|auth/admin)/login$ {
        limit_req zone=adminlogin burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端 API：Express 监听 127.0.0.1:3000
    location /api/v1/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 封面上传：后端 express.static(server/public/uploads)
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
    }

    # 图标上传：实际写入 manage/public/images/upload
    location /images/ {
        alias /var/www/mixing-drinks/manage/public/images/;
        expires 7d;
    }

    # 其他路径一律 404，绝不回退到后台的 index.html
    location / {
        try_files $uri =404;
    }
}

# ============================================================
# B. 管理后台子域（备案通过后的正式入口）
# 前端用同源相对路径 /api/v1，所以这里也必须反代 API 与上传路径
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name manage.myty11.com;

    root /var/www/mixing-drinks/manage/dist;
    index index.html;
    client_max_body_size 6m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/manage.access.log;
    error_log  /var/log/nginx/manage.error.log;

    location ~ ^/api/v1/(admin|auth/admin)/login$ {
        limit_req zone=adminlogin burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
    }

    location /images/ {
        alias /var/www/mixing-drinks/manage/public/images/;
        expires 7d;
    }

    # 后台页面（React Router SPA）
    # 可选：取消下面两行注释，给后台再加一道 HTTP Basic Auth。
    # 必须先生成 /etc/nginx/.htpasswd 再启用，否则后台页面全部 500；
    # 只放在这里、不放在 server 级，是为了不影响 /api/v1（小程序与后台接口）。
    location / {
        # auth_basic "Admin";
        # auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri/ /index.html;
    }

    # 可选：只允许自己的 IP 访问后台（按需取消注释并改成你的公网 IP）
    # allow 1.2.3.4;
    # deny all;
}

# ============================================================
# C. 备案期临时入口：域名还被拦截时，用公网 IP / 127.0.0.1 访问后台
# 备案通过后：把 server_name 里的 8.134.248.177 删掉（保留 127.0.0.1 仅供本机自检），
# 公网 IP 访问就会落到 A 块的 default_server，只显示欢迎页。
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name 8.134.248.177 127.0.0.1;

    root /var/www/mixing-drinks/deploy/welcome;
    index index.html;
    client_max_body_size 6m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/mixing.access.log;
    error_log  /var/log/nginx/mixing.error.log;

    location = / {
        try_files /index.html =404;
    }

    # 备案期后台入口：显式访问 /login、/dashboard 等路径才给后台页面
    # 备案期这才是真正在用的后台入口，所以 Basic Auth 必须和 B 块一起加。
    # 只放在这个 location 内，不放 server 级：C 块还承担小程序的 /api/v1，不能一起拦。
    # 必须先生成 /etc/nginx/.htpasswd 再取消注释，否则后台页面 500。
    location ~ ^/(login|dashboard|cocktails|ingredients|categories|users)(/|$) {
        # auth_basic "Admin";
        # auth_basic_user_file /etc/nginx/.htpasswd;
        # allow 1.2.3.4;
        # deny all;
        root /var/www/mixing-drinks/manage/dist;
        try_files /index.html =404;
    }

    # 后台 SPA 的静态资源（JS/CSS）
    location /assets/ {
        alias /var/www/mixing-drinks/manage/dist/assets/;
        expires 7d;
    }

    location ~ ^/api/v1/(admin|auth/admin)/login$ {
        limit_req zone=adminlogin burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
    }

    location /images/ {
        alias /var/www/mixing-drinks/manage/public/images/;
        expires 7d;
    }

    location / {
        try_files $uri =404;
    }
}
