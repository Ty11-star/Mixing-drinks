<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 深咖底 + 琥珀氛围（与后台主题一致） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1f15"/>
      <stop offset="1" stop-color="#140d07"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6C79C"/>
      <stop offset="1" stop-color="#C08E57"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#bg)"/>
  <rect x="1" y="1" width="30" height="30" rx="7" fill="none" stroke="#E0B079" stroke-opacity="0.35"/>

  <!-- 马天尼杯 -->
  <g fill="none" stroke="url(#amber)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 7h16l-8 10v7"/>
    <path d="M12 27h8"/>
  </g>
  <!-- 杯中酒液 -->
  <path d="M11.2 10.5h9.6L16 15.4z" fill="#E0B079" opacity="0.55"/>
  <!-- 冰蓝点缀（薄荷叶/冰粒） -->
  <circle cx="21.5" cy="9" r="2" fill="#6FB3D6"/>
  <!-- 气泡 -->
  <circle cx="10" cy="4.5" r="1" fill="#E0B079" opacity="0.7"/>
  <circle cx="13.5" cy="3.2" r="0.8" fill="#E0B079" opacity="0.5"/>
</svg>
