<!DOCTYPE html>
<html lang="zh-CN" data-theme="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>慢酌 · 界面重设计原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ 设计令牌 ============ */
:root{
  --font-display:'Cormorant Garamond','Noto Serif SC','Songti SC',serif;
  --font-serif:'Noto Serif SC','Songti SC','STSong',serif;
  --font-body:'DM Sans','Noto Sans SC',-apple-system,'PingFang SC',sans-serif;

  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:24px; --space-6:32px; --space-7:48px; --space-8:64px;

  --r-sm:12px; --r-md:18px; --r-lg:28px; --r-pill:999px;

  --ease:cubic-bezier(.22,.61,.36,1);
  --dur:.45s;

  --img-mojito:url('server/public/uploads/1793787710854-457430532.png');
  --img-margarita:url('server/public/uploads/1793796778405-679592327.png');
  --img-tonic:url('server/public/uploads/1793796787995-498359043.png');
  --img-bloody:url('server/public/uploads/1793796795373-304837180.png');
}

/* 深夜蓝调 */
[data-theme="night"]{
  --bg:#0A141B;
  --bg-soft:#101E28;
  --bg-deep:#060E14;
  --glass:rgba(255,255,255,.055);
  --glass-strong:rgba(255,255,255,.095);
  --glass-border:rgba(255,255,255,.14);
  --glass-hi:rgba(255,255,255,.20);
  --text:#F2ECE2;
  --text-2:#A6B5BF;
  --text-3:#6E8290;
  --accent:#D9AE7C;
  --accent-2:#C08E77;
  --accent-soft:rgba(217,174,124,.14);
  --accent-glow:rgba(217,174,124,.30);
  --divider:rgba(255,255,255,.09);
  --shadow:0 24px 60px rgba(0,0,0,.42);
  --shadow-sm:0 8px 28px rgba(0,0,0,.30);
  --orb-a:rgba(217,174,124,.20);
  --orb-b:rgba(74,134,148,.22);
  --img-filter:brightness(.58) saturate(.82) hue-rotate(-6deg);
  --veil:linear-gradient(180deg,rgba(10,20,27,.30) 0%,rgba(10,20,27,.58) 48%,var(--bg) 97%);
  --veil-detail:linear-gradient(180deg,rgba(10,20,27,.42) 0%,rgba(10,20,27,.14) 40%,rgba(10,20,27,.72) 88%,var(--bg) 100%);
  --tabbar-bg:rgba(22,36,46,.62);
  --scrim:radial-gradient(ellipse at 50% 0%,rgba(40,70,84,.28),transparent 62%);
}

/* 晨光微醺 */
[data-theme="dawn"]{
  --bg:#E9EBE6;
  --bg-soft:#F3F4EF;
  --bg-deep:#DDE1DA;
  --glass:rgba(255,255,255,.52);
  --glass-strong:rgba(255,255,255,.76);
  --glass-border:rgba(255,255,255,.82);
  --glass-hi:rgba(255,255,255,.95);
  --text:#2B3636;
  --text-2:#5E6B68;
  --text-3:#87928D;
  --accent:#A87844;
  --accent-2:#8C7A5E;
  --accent-soft:rgba(168,120,68,.10);
  --accent-glow:rgba(168,120,68,.22);
  --divider:rgba(43,54,54,.10);
  --shadow:0 24px 60px rgba(52,68,60,.14);
  --shadow-sm:0 8px 28px rgba(52,68,60,.10);
  --orb-a:rgba(214,178,126,.24);
  --orb-b:rgba(138,176,164,.22);
  --img-filter:brightness(1.02) saturate(.88);
  --veil:linear-gradient(180deg,rgba(233,235,230,.12) 0%,rgba(233,235,230,.62) 52%,var(--bg) 97%);
  --veil-detail:linear-gradient(180deg,rgba(233,235,230,.28) 0%,rgba(233,235,230,.06) 38%,rgba(233,235,230,.68) 85%,var(--bg) 100%);
  --tabbar-bg:rgba(255,255,255,.62);
  --scrim:radial-gradient(ellipse at 50% 0%,rgba(255,252,240,.55),transparent 60%);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:var(--font-body);
  background:#11161A;
  background-image:radial-gradient(ellipse at 15% 0%,#1B2329 0%,transparent 45%),radial-gradient(ellipse at 85% 100%,#172025 0%,transparent 50%);
  color:#E8E6E1;
  min-height:100vh;
  padding:32px 24px 64px;
}

/* ============ 工作台 ============ */
.workbench{max-width:1720px;margin:0 auto}
.wb-top{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;flex-wrap:wrap;margin-bottom:36px}
.wb-brand h1{font-family:var(--font-serif);font-weight:400;font-size:26px;letter-spacing:.14em;color:#F1EDE5}
.wb-brand h1 span{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;font-size:20px;letter-spacing:.02em;color:#A9B4B8;margin-left:10px}
.wb-brand p{font-size:12px;color:#78858B;margin-top:7px;letter-spacing:.06em}
.wb-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{
  display:inline-flex;align-items:center;gap:2px;padding:4px;
  background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);
  border-radius:var(--r-pill);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
.seg button{
  font-family:var(--font-body);font-size:12px;letter-spacing:.04em;
  padding:9px 16px;border:0;border-radius:var(--r-pill);background:transparent;
  color:#8E9A9F;cursor:pointer;transition:color .25s,background .25s,box-shadow .25s;
  white-space:nowrap;
}
.seg button:hover{color:#D9DEDC}
.seg button.on{
  color:#F4F0E8;background:rgba(255,255,255,.11);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 2px 10px rgba(0,0,0,.2);
}
.wb-stage{display:flex;justify-content:center}
.wb-stage.gallery{justify-content:flex-start;overflow-x:auto;padding-bottom:24px}
.wb-stage.gallery::-webkit-scrollbar{height:6px}
.wb-stage.gallery::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:99px}

.device-unit{display:flex;flex-direction:column;align-items:center;gap:14px;flex:0 0 auto}
.unit-label{font-size:11px;letter-spacing:.12em;color:#7F8B90;display:flex;align-items:center;gap:9px}
.unit-label::before{content:'';width:18px;height:1px;background:#4C5A60}
.gallery .device-unit{padding:0 10px}

/* ============ 设备框架 ============ */
.device{
  position:relative;width:390px;height:844px;flex:0 0 auto;
  border-radius:54px;padding:11px;
  background:linear-gradient(145deg,#3A444A,#151C21 38%,#0B1115 70%,#303A40);
  box-shadow:0 40px 90px rgba(0,0,0,.55),0 8px 22px rgba(0,0,0,.4),inset 0 1px 1px rgba(255,255,255,.22);
}
.device::after{
  content:'';position:absolute;inset:0;border-radius:54px;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);
}
.screen{
  position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;
  background:var(--bg);color:var(--text);
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease);
}
.screen::before{
  content:'';position:absolute;inset:0;background:var(--scrim);pointer-events:none;z-index:0;
}
.notch{
  position:absolute;top:11px;left:50%;transform:translateX(-50%);
  width:112px;height:30px;border-radius:0 0 18px 18px;background:#0B1115;z-index:60;
}
.notch::after{
  content:'';position:absolute;right:22px;top:11px;width:7px;height:7px;border-radius:50%;
  background:#15232C;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);
}

/* 状态栏 */
.statusbar{
  position:absolute;top:0;left:0;right:0;height:54px;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 28px 0;pointer-events:none;color:var(--text);
}
.sb-time{font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;letter-spacing:.02em}
.sb-icons{display:flex;align-items:center;gap:5px;opacity:.9}
.sb-icons svg{display:block}

/* ============ 通用组件 ============ */
.glass{
  background:var(--glass);
  backdrop-filter:blur(26px) saturate(165%);
  -webkit-backdrop-filter:blur(26px) saturate(165%);
  border:1px solid var(--glass-border);
  box-shadow:inset 0 1px 0 var(--glass-hi),var(--shadow-sm);
}
.icon-btn{
  width:42px;height:42px;border-radius:50%;border:1px solid var(--glass-border);
  display:grid;place-items:center;cursor:pointer;color:var(--text);
  background:var(--glass);backdrop-filter:blur(22px) saturate(160%);
  -webkit-backdrop-filter:blur(22px) saturate(160%);
  box-shadow:inset 0 1px 0 var(--glass-hi),var(--shadow-sm);
  transition:transform .3s var(--ease),background .3s,box-shadow .3s;
}
.icon-btn:hover{transform:translateY(-2px);background:var(--glass-strong)}
.icon-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.fav.active{color:var(--accent)}
.icon-btn.fav.active svg{fill:var(--accent);stroke:var(--accent)}

.scroll-body{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;z-index:1;scrollbar-width:none}
.scroll-body::-webkit-scrollbar{display:none}

/* 光晕 */
.orb{position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none;z-index:0}
.orb.a{width:300px;height:300px;background:var(--orb-a);top:-90px;right:-110px}
.orb.b{width:260px;height:260px;background:var(--orb-b);top:260px;left:-140px}

/* ============ 首页 ============ */
.hero{position:relative;height:560px;overflow:hidden}
.hero-media{
  position:absolute;inset:-10px 0 0;background-image:var(--img);background-size:cover;background-position:center 38%;
  filter:var(--img-filter);transform:scale(1.02);
  transition:filter var(--dur) var(--ease);
}
.hero-veil{position:absolute;inset:0;background:var(--veil);transition:background var(--dur) var(--ease)}
.hero-glow{
  position:absolute;width:340px;height:340px;right:-80px;top:40px;border-radius:50%;
  background:radial-gradient(circle,var(--accent-glow),transparent 68%);filter:blur(38px);pointer-events:none;
}
.hero-inner{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;padding:96px 28px 34px}
.brandline{display:flex;align-items:center;justify-content:space-between}
.brandmark{display:flex;align-items:baseline;gap:9px}
.brandmark b{font-family:var(--font-serif);font-weight:500;font-size:17px;letter-spacing:.22em;color:var(--text)}
.brandmark i{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;letter-spacing:.08em;color:var(--accent)}
.menu-btn{width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--text);opacity:.85}
.menu-btn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round}

.hero-copy{margin-top:auto;padding-bottom:34px;animation:rise 1s var(--ease) both}
.hero-kicker{display:flex;align-items:center;gap:11px;margin-bottom:18px}
.hero-kicker .line{width:26px;height:1px;background:var(--accent);opacity:.8}
.hero-kicker span{font-family:var(--font-serif);font-size:11px;letter-spacing:.28em;color:var(--text-2)}
.hero-title{
  font-family:var(--font-serif);font-weight:300;font-size:46px;line-height:1.22;letter-spacing:.02em;
  color:var(--text);text-shadow:0 2px 24px rgba(0,0,0,.16);
}
.hero-title em{font-style:normal;color:var(--accent)}
.hero-sub{font-size:13px;line-height:1.9;color:var(--text-2);margin-top:16px;letter-spacing:.04em;max-width:250px}

.search-pill{
  margin-top:28px;width:100%;height:52px;border-radius:var(--r-pill);
  display:flex;align-items:center;gap:12px;padding:0 20px;cursor:pointer;
  background:var(--glass-strong);backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border:1px solid var(--glass-border);
  box-shadow:inset 0 1px 0 var(--glass-hi),var(--shadow-sm);
  position:relative;overflow:hidden;transition:transform .35s var(--ease),background .35s;
}
.search-pill:hover{transform:translateY(-2px)}
.search-pill::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 32%,rgba(255,255,255,.13) 50%,transparent 68%);
  transform:translateX(-110%);transition:transform .75s var(--ease);
}
.search-pill:hover::after{transform:translateX(110%)}
.search-pill svg{width:18px;height:18px;fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linecap:round;flex:0 0 auto}
.search-pill span{font-size:13px;color:var(--text-2);letter-spacing:.06em}

.scroll-hint{display:flex;align-items:center;gap:9px;margin-top:26px}
.scroll-hint i{display:block;width:1px;height:22px;background:linear-gradient(var(--text-3),transparent)}
.scroll-hint span{font-size:10px;letter-spacing:.22em;color:var(--text-3)}

.home-content{position:relative;padding:42px 28px 130px;z-index:2}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px}
.section-head h2{font-family:var(--font-serif);font-weight:400;font-size:22px;letter-spacing:.06em;color:var(--text)}
.section-head h2 small{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;color:var(--text-3);margin-left:9px;letter-spacing:0}
.section-head button{background:none;border:0;color:var(--text-3);font-size:11px;letter-spacing:.1em;cursor:pointer;display:flex;align-items:center;gap:5px;padding:6px 0}
.section-head button svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.section-head button:hover{color:var(--accent)}

.card-row{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;margin:0 -28px;padding:2px 28px 10px}
.card-row::-webkit-scrollbar{display:none}
.recipe-card{
  flex:0 0 208px;height:268px;border-radius:var(--r-lg);position:relative;overflow:hidden;cursor:pointer;
  box-shadow:var(--shadow-sm);transition:transform .45s var(--ease),box-shadow .45s var(--ease);
}
.recipe-card:hover{transform:translateY(-6px);box-shadow:0 24px 44px rgba(0,0,0,.28)}
.recipe-card .rc-img{position:absolute;inset:0;background-image:var(--img);background-size:cover;background-position:center;filter:var(--img-filter);transition:filter var(--dur) var(--ease),transform .8s var(--ease)}
.recipe-card:hover .rc-img{transform:scale(1.06)}
.recipe-card .rc-veil{position:absolute;inset:0;background:linear-gradient(180deg,transparent 32%,rgba(6,14,20,.18) 52%,rgba(6,14,20,.88) 100%)}
[data-theme="dawn"] .recipe-card .rc-veil{background:linear-gradient(180deg,transparent 34%,rgba(38,48,44,.10) 55%,rgba(30,40,38,.80) 100%)}
.recipe-card .rc-body{position:absolute;left:20px;right:20px;bottom:20px;color:#FBF7EF}
.recipe-card .rc-name{font-family:var(--font-serif);font-weight:400;font-size:19px;letter-spacing:.06em}
.recipe-card .rc-en{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;color:rgba(251,247,239,.72);margin-top:2px}
.recipe-card .rc-desc{font-size:11px;line-height:1.7;color:rgba(251,247,239,.78);margin-top:10px;letter-spacing:.02em}

.quote-block{margin-top:52px;padding:26px 24px;border-radius:var(--r-md);position:relative;overflow:hidden}
.quote-block::before{
  content:'';position:absolute;left:0;top:22px;bottom:22px;width:2px;border-radius:2px;
  background:linear-gradient(var(--accent),transparent);
}
.quote-block p{font-family:var(--font-serif);font-weight:300;font-size:15px;line-height:2.05;letter-spacing:.04em;color:var(--text-2)}
.quote-block p em{font-style:normal;color:var(--accent)}

/* TabBar */
.tabbar{
  position:absolute;left:20px;right:20px;bottom:20px;height:68px;z-index:40;border-radius:var(--r-pill);
  display:flex;align-items:center;justify-content:space-around;padding:0 10px;
  background:var(--tabbar-bg);backdrop-filter:blur(32px) saturate(180%);-webkit-backdrop-filter:blur(32px) saturate(180%);
  border:1px solid var(--glass-border);
  box-shadow:inset 0 1px 0 var(--glass-hi),0 18px 44px rgba(0,0,0,.28);
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;
  color:var(--text-3);transition:color .3s;
}
.tab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:10px;letter-spacing:.08em}
.tab.on{color:var(--accent)}
.tab:hover{color:var(--text-2)}

/* ============ 详情页 ============ */
.detail-hero{position:absolute;top:0;left:0;right:0;height:430px;overflow:hidden}
.detail-hero .dh-img{position:absolute;inset:0;background-image:var(--img);background-size:cover;background-position:center 35%;filter:var(--img-filter);transition:filter var(--dur) var(--ease)}
.detail-hero .dh-veil{position:absolute;inset:0;background:var(--veil-detail);transition:background var(--dur) var(--ease)}
.detail-top{position:absolute;top:62px;left:24px;right:24px;z-index:5;display:flex;justify-content:space-between}
.detail-hero-copy{position:absolute;left:30px;right:30px;bottom:86px;z-index:4;animation:rise 1s var(--ease) both}
.detail-kicker{font-family:var(--font-serif);font-size:11px;letter-spacing:.26em;color:var(--text-2);margin-bottom:12px}
.detail-title{font-family:var(--font-serif);font-weight:300;font-size:42px;letter-spacing:.06em;line-height:1.15;color:var(--text)}
.detail-en{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;font-size:23px;color:var(--accent);margin-top:4px;letter-spacing:.01em}
.detail-tags{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.tag{
  font-size:10px;letter-spacing:.12em;padding:7px 13px;border-radius:var(--r-pill);
  color:var(--text-2);background:var(--glass);border:1px solid var(--glass-border);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}

.detail-sheet{
  position:relative;margin-top:346px;border-radius:36px 36px 0 0;z-index:6;
  background:var(--bg);padding:34px 30px 140px;min-height:600px;
  transition:background var(--dur) var(--ease);
}
.sheet-handle{width:36px;height:4px;border-radius:4px;background:var(--divider);margin:0 auto 30px}
.detail-desc{font-family:var(--font-serif);font-weight:300;font-size:15px;line-height:2.15;letter-spacing:.035em;color:var(--text-2)}
.detail-desc em{font-style:normal;color:var(--text)}

.meta-row{display:flex;justify-content:space-between;gap:8px;padding:26px 0;margin-top:26px;border-top:1px solid var(--divider);border-bottom:1px solid var(--divider)}
.meta-item{display:flex;flex-direction:column;align-items:center;gap:7px;flex:1}
.meta-item b{font-family:var(--font-serif);font-weight:400;font-size:14px;color:var(--text);letter-spacing:.04em}
.meta-item span{font-size:10px;letter-spacing:.14em;color:var(--text-3)}

.block{margin-top:44px}
.block-head{display:flex;align-items:baseline;gap:12px;margin-bottom:24px}
.block-head h3{font-family:var(--font-serif);font-weight:400;font-size:20px;letter-spacing:.1em;color:var(--text)}
.block-head small{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;color:var(--text-3)}

.ing-list{display:flex;flex-direction:column;gap:0}
.ing-item{display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--divider)}
.ing-item:last-child{border-bottom:0}
.ing-name{display:flex;align-items:center;gap:13px;font-size:13px;letter-spacing:.05em;color:var(--text)}
.ing-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.ing-amt{font-family:'Cormorant Garamond',var(--font-serif),serif;font-size:16px;color:var(--text-2);letter-spacing:.02em}

.steps{display:flex;flex-direction:column;gap:0;position:relative}
.step{display:flex;gap:18px;position:relative;padding-bottom:28px}
.step:last-child{padding-bottom:0}
.step::before{content:'';position:absolute;left:15px;top:34px;bottom:0;width:1px;background:linear-gradient(var(--divider),transparent)}
.step:last-child::before{display:none}
.step-num{
  flex:0 0 32px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  font-family:'Cormorant Garamond',serif;font-size:17px;color:var(--accent);
  border:1px solid var(--accent-soft);background:var(--accent-soft);
}
.step-copy{padding-top:3px}
.step-copy b{display:block;font-family:var(--font-serif);font-weight:400;font-size:14px;letter-spacing:.05em;color:var(--text);margin-bottom:7px}
.step-copy p{font-size:12px;line-height:1.95;color:var(--text-2);letter-spacing:.025em}

.tip-card{margin-top:46px;padding:24px 22px;border-radius:var(--r-md);position:relative}
.tip-card .tip-label{font-family:var(--font-serif);font-size:11px;letter-spacing:.2em;color:var(--accent);margin-bottom:12px}
.tip-card p{font-size:12px;line-height:2;color:var(--text-2);letter-spacing:.03em}

.detail-action{
  position:absolute;left:20px;right:20px;bottom:20px;height:66px;border-radius:var(--r-pill);z-index:40;
  display:flex;align-items:center;gap:10px;padding:7px 8px 7px 10px;
  background:var(--tabbar-bg);backdrop-filter:blur(32px) saturate(180%);-webkit-backdrop-filter:blur(32px) saturate(180%);
  border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-hi),0 18px 44px rgba(0,0,0,.24);
}
.act-icon{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--text);border:1px solid var(--glass-border);background:var(--glass);flex:0 0 auto}
.act-icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.act-icon.active{color:var(--accent)}
.act-icon.active svg{fill:var(--accent)}
.act-main{
  flex:1;height:50px;border-radius:var(--r-pill);cursor:pointer;border:1px solid rgba(255,255,255,.16);
  display:flex;align-items:center;justify-content:center;gap:9px;
  background:linear-gradient(120deg,var(--accent),var(--accent-2));
  color:#fff;font-family:var(--font-serif);font-size:14px;letter-spacing:.14em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 8px 22px var(--accent-glow);
  position:relative;overflow:hidden;transition:transform .35s var(--ease);
}
.act-main:hover{transform:translateY(-2px)}
.act-main::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);transform:translateX(-110%);transition:transform .75s var(--ease)}
.act-main:hover::after{transform:translateX(110%)}

@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div class="workbench">
  <header class="wb-top">
    <div class="wb-brand">
      <h1>慢酌<span>Slow SIP · Design Study</span></h1>
      <p>界面重设计原型 · 液态玻璃 / 低密度 / 慢节奏</p>
    </div>
    <div class="wb-controls">
      <div class="seg" id="themeSeg">
        <button data-val="night" class="on">深夜蓝调</button>
        <button data-val="dawn">晨光微醺</button>
      </div>
      <div class="seg" id="pageSeg">
        <button data-val="home" class="on">首页</button>
        <button data-val="detail">酒谱详情</button>
      </div>
      <div class="seg" id="viewSeg">
        <button data-val="single" class="on">单机预览</button>
        <button data-val="gallery">四屏对比</button>
      </div>
    </div>
  </header>

  <main class="wb-stage" id="stage"></main>
</div>

<!-- ============ 状态栏模板 ============ -->
<template id="tpl-status">
  <div class="statusbar">
    <span class="sb-time">9:41</span>
    <div class="sb-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M1 4.4a10.5 10.5 0 0 1 14 0"/><path d="M3.8 7.1a6.5 6.5 0 0 1 8.4 0"/><path d="M6.6 9.8a2.5 2.5 0 0 1 2.8 0"/></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x=".5" y=".5" width="20" height="11" rx="3" stroke="currentColor" stroke-opacity=".5"/><rect x="2" y="2" width="16" height="8" rx="1.8" fill="currentColor"/><path d="M22 4v4a2 2 0 0 0 0-4Z" fill="currentColor" opacity=".5"/></svg>
    </div>
  </div>
</template>

<!-- ============ 首页模板 ============ -->
<template id="tpl-home">
  <div class="orb a"></div><div class="orb b"></div>
  <div class="scroll-body">
    <section class="hero" style="--img:var(--img-mojito)">
      <div class="hero-media"></div>
      <div class="hero-veil"></div>
      <div class="hero-glow"></div>
      <div class="hero-inner">
        <div class="brandline">
          <div class="brandmark"><b>慢酌</b><i>Slow SIP</i></div>
          <div class="menu-btn" title="菜单"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></div>
        </div>
        <div class="hero-copy">
          <div class="hero-kicker"><i class="line"></i><span>今夜适合慢一点</span></div>
          <h1 class="hero-title">把夜晚，<br>调<em>慢</em>一点</h1>
          <p class="hero-sub">为此刻的心情，找一杯合适的酒。<br>不必着急，慢慢挑。</p>
          <div class="search-pill" data-go="search">
            <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4 4"/></svg>
            <span>想喝点什么味道？</span>
          </div>
          <div class="scroll-hint"><i></i><span>往下，慢慢看</span></div>
        </div>
      </div>
    </section>

    <section class="home-content">
      <div class="section-head">
        <h2>此刻推荐<small>for tonight</small></h2>
        <button>全部 <svg viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
      </div>

      <div class="card-row">
        <article class="recipe-card" data-go="detail" style="--img:var(--img-mojito)">
          <div class="rc-img"></div><div class="rc-veil"></div>
          <div class="rc-body"><div class="rc-name">莫吉托</div><div class="rc-en">Mojito</div><div class="rc-desc">薄荷与青柠的夏日呼吸</div></div>
        </article>
        <article class="recipe-card" data-go="detail" style="--img:var(--img-margarita)">
          <div class="rc-img"></div><div class="rc-veil"></div>
          <div class="rc-body"><div class="rc-name">玛格丽特</div><div class="rc-en">Margarita</div><div class="rc-desc">盐边、青柠，和一点微醺的酸</div></div>
        </article>
        <article class="recipe-card" data-go="detail" style="--img:var(--img-tonic)">
          <div class="rc-img"></div><div class="rc-veil"></div>
          <div class="rc-body"><div class="rc-name">金汤力</div><div class="rc-en">Gin &amp; Tonic</div><div class="rc-desc">植物香气在气泡里浮沉</div></div>
        </article>
      </div>

      <div class="quote-block glass">
        <p>喝酒这件事，<br>喝的从来不只是酒。<br><em>是停下来那一刻的自己。</em></p>
      </div>
    </section>
  </div>

  <nav class="tabbar">
    <div class="tab on"><svg viewBox="0 0 24 24"><path d="M4 11.2 12 4l8 7.2V20H4v-8.8Z"/><path d="M9.5 20v-5h5v5"/></svg><span>首页</span></div>
    <div class="tab"><svg viewBox="0 0 24 24"><path d="M8 3h8l-1.1 5.2H9.1L8 3Z"/><path d="M9.1 8.2h5.8l2 9.4a2 2 0 0 1-2 2.4H9.1a2 2 0 0 1-2-2.4l2-9.4Z"/><path d="M7.4 14.6h9.2"/></svg><span>调一杯</span></div>
    <div class="tab"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="m12 7.4 1.25 2.6 2.85.4-2.05 2 .5 2.85L12 13.9l-2.55 1.35.5-2.85-2.05-2 2.85-.4L12 7.4Z"/></svg><span>抽卡</span></div>
    <div class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg><span>我的</span></div>
  </nav>
</template>

<!-- ============ 详情页模板 ============ -->
<template id="tpl-detail">
  <div class="orb a"></div>
  <div class="scroll-body">
    <section class="detail-hero" style="--img:var(--img-mojito)">
      <div class="dh-img"></div><div class="dh-veil"></div>
      <div class="detail-top">
        <div class="icon-btn" data-go="home" title="返回"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></div>
        <div class="icon-btn fav" data-fav="1" title="收藏"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-9.4A4.4 4.4 0 0 1 12 7.2a4.4 4.4 0 0 1 7 3.4C19 15.5 12 20 12 20Z"/></svg></div>
      </div>
      <div class="detail-hero-copy">
        <div class="detail-kicker">今夜的第一杯</div>
        <h1 class="detail-title">莫吉托</h1>
        <div class="detail-en">Mojito</div>
        <div class="detail-tags"><span class="tag">清爽</span><span class="tag">微甜</span><span class="tag">低度</span><span class="tag">古巴</span></div>
      </div>
    </section>

    <section class="detail-sheet">
      <div class="sheet-handle"></div>
      <p class="detail-desc">源自古巴的经典。<em>薄荷的清凉、青柠的明亮</em>，和朗姆酒温柔的甜，在碎冰里慢慢融在一起。喝一口，就像把夏夜晚风含在嘴里。</p>

      <div class="meta-row">
        <div class="meta-item"><b>高球杯</b><span>杯型</span></div>
        <div class="meta-item"><b>碎冰</b><span>冰型</span></div>
        <div class="meta-item"><b>简单</b><span>难度</span></div>
        <div class="meta-item"><b>low</b><span>酒精度</span></div>
      </div>

      <div class="block">
        <div class="block-head"><h3>需要这些</h3><small>ingredients</small></div>
        <div class="ing-list">
          <div class="ing-item"><div class="ing-name"><i class="ing-dot"></i>白朗姆酒</div><div class="ing-amt">45 ml</div></div>
          <div class="ing-item"><div class="ing-name"><i class="ing-dot"></i>青柠汁</div><div class="ing-amt">20 ml</div></div>
          <div class="ing-item"><div class="ing-name"><i class="ing-dot"></i>苏打水</div><div class="ing-amt">适量</div></div>
          <div class="ing-item"><div class="ing-name"><i class="ing-dot"></i>白糖</div><div class="ing-amt">2 勺</div></div>
          <div class="ing-item"><div class="ing-name"><i class="ing-dot"></i>薄荷叶</div><div class="ing-amt">8–10 片</div></div>
          <div class="ing-item"><div class="ing-name"><i class="ing-dot"></i>冰块</div><div class="ing-amt">适量</div></div>
        </div>
      </div>

      <div class="block">
        <div class="block-head"><h3>慢慢来</h3><small>steps</small></div>
        <div class="steps">
          <div class="step"><div class="step-num">1</div><div class="step-copy"><b>唤醒薄荷</b><p>薄荷叶和白糖放进杯里，用捣棒轻轻压几下，香气出来就好。</p></div></div>
          <div class="step"><div class="step-num">2</div><div class="step-copy"><b>注入青柠</b><p>倒进新鲜青柠汁，轻轻搅一搅，让糖慢慢化开。</p></div></div>
          <div class="step"><div class="step-num">3</div><div class="step-copy"><b>碎冰八分满</b><p>碎冰填到杯子的八分满，杯子会自动降到合适的温度。</p></div></div>
          <div class="step"><div class="step-num">4</div><div class="step-copy"><b>倒入朗姆</b><p>白朗姆酒缓缓倒入，轻轻搅匀，别急着喝。</p></div></div>
          <div class="step"><div class="step-num">5</div><div class="step-copy"><b>注满与装饰</b><p>苏打水加满，放上薄荷叶和青柠片，完成。</p></div></div>
        </div>
      </div>

      <div class="tip-card glass">
        <div class="tip-label">一点小提醒</div>
        <p>薄荷叶只要轻轻按压就好，压得太碎会渗出苦味。慢慢来，味道会不一样。</p>
      </div>
    </section>
  </div>

  <div class="detail-action">
    <div class="act-icon fav" data-fav="1" title="收藏"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-9.4A4.4 4.4 0 0 1 12 7.2a4.4 4.4 0 0 1 7 3.4C19 15.5 12 20 12 20Z"/></svg></div>
    <div class="act-main" data-go="home">开始调一杯</div>
  </div>
</template>

<script>
(function(){
  var state={theme:'night',page:'home',view:'single'};
  var stage=document.getElementById('stage');

  var templateIds={home:'tpl-home',detail:'tpl-detail'};

  function makeDevice(page,theme,label){
    var unit=document.createElement('div');
    unit.className='device-unit';

    if(label){
      var lb=document.createElement('div');
      lb.className='unit-label';
      lb.textContent=label;
      unit.appendChild(lb);
    }

    var dev=document.createElement('div');
    dev.className='device';

    var scr=document.createElement('div');
    scr.className='screen';
    scr.setAttribute('data-theme',theme);

    var notch=document.createElement('div');
    notch.className='notch';
    scr.appendChild(notch);

    scr.appendChild(document.getElementById('tpl-status').content.cloneNode(true));
    scr.appendChild(document.getElementById(templateIds[page]).content.cloneNode(true));

    dev.appendChild(scr);
    unit.appendChild(dev);
    bind(unit);
    return unit;
  }

  function bind(root){
    root.querySelectorAll('[data-go]').forEach(function(el){
      el.addEventListener('click',function(){
        state.page=el.getAttribute('data-go');
        setSeg('pageSeg',state.page);
        render();
      });
    });
    root.querySelectorAll('[data-fav]').forEach(function(el){
      el.addEventListener('click',function(){
        var on=el.classList.toggle('active');
        root.querySelectorAll('[data-fav]').forEach(function(x){x.classList.toggle('active',on)});
      });
    });
  }

  function setSeg(id,val){
    document.querySelectorAll('#'+id+' button').forEach(function(b){
      b.classList.toggle('on',b.getAttribute('data-val')===val);
    });
  }

  function render(){
    document.documentElement.setAttribute('data-theme',state.theme);
    stage.innerHTML='';
    stage.classList.toggle('gallery',state.view==='gallery');

    if(state.view==='single'){
      var d=makeDevice(state.page,state.theme,null);
      stage.appendChild(d);
    }else{
      var combos=[
        {p:'home',t:'night',l:'深夜蓝调 · 首页'},
        {p:'detail',t:'night',l:'深夜蓝调 · 酒谱详情'},
        {p:'home',t:'dawn',l:'晨光微醺 · 首页'},
        {p:'detail',t:'dawn',l:'晨光微醺 · 酒谱详情'}
      ];
      combos.forEach(function(c){stage.appendChild(makeDevice(c.p,c.t,c.l))});
    }
  }

  function wireSeg(id,key){
    document.getElementById(id).addEventListener('click',function(e){
      var b=e.target.closest('button');
      if(!b)return;
      state[key]=b.getAttribute('data-val');
      setSeg(id,state[key]);
      render();
    });
  }

  wireSeg('themeSeg','theme');
  wireSeg('pageSeg','page');
  wireSeg('viewSeg','view');
  render();
})();
</script>
</body>
</html>
